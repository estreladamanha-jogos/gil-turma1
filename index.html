<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fagulha — Queda entre Mundos</title>
<style>
  html, body { margin: 0; height: 100%; background: #05050f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(96vw, calc(96vh * 420 / 640)); height: auto; background: #0a0a18; border-radius: 12px; box-shadow: 0 0 30px rgba(140,90,255,.35); }
</style>
</head>
<body>
<canvas id="game" width="420" height="640"></canvas>
<script>
/* Fagulha: um ET fofo e esquisito (cabeça grande, olhos enormes, orelhas de folha, braços e pernas compridos).
   o = { vx: -1..1 (inclinação), glow: cor da luz do peito (null = apagada), hit: true, alpha, pose: 'fall' | 'stand' | 'cheer' } */
function drawFagulha(c, x, y, s, t, o) {
  o = o || {};
  const glow = o.glow === undefined ? '#ffe9a8' : o.glow;
  const pose = o.pose || 'fall';
  const hit = !!o.hit;
  const sw = Math.sin(t * 7), sw2 = Math.sin(t * 7 + 1.9);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  const ear = Math.sin(t * 3.2) * 5;
  const skinL = hit ? '#f0c4c4' : '#d3cdf0', skinD = hit ? '#d99a9a' : '#9a91c4', line = '#2b2350';
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.rotate((o.vx || 0) * 0.16);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const P = { fall: [32, 78, 78, 12], stand: [-62, -78, -82, -6], cheer: [62, 88, 78, 8] }[pose];
  // ---- pernas (atrás do corpo) ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const hx = sd * 8, hy = 38;
    const kx = hx + sd * (5 + P[3] * .3) + ph * 3, ky = hy + 32;
    const fx = kx + sd * 3 + ph * (pose === 'fall' ? 9 : 2), fy = ky + 34;
    c.strokeStyle = line; c.lineWidth = 11; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = skinD; c.lineWidth = 7; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2;
    c.beginPath(); c.ellipse(fx + sd * 4, fy + 3, 12, 5.5, sd * -.12, 0, 7); c.fill(); c.stroke();
  }
  // ---- corpo ----
  const gb = c.createLinearGradient(0, -6, 0, 46); gb.addColorStop(0, skinL); gb.addColorStop(1, skinD);
  c.fillStyle = gb; c.strokeStyle = line; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(-9, -8); c.bezierCurveTo(-20, 4, -20, 34, -9, 44); c.lineTo(9, 44); c.bezierCurveTo(20, 34, 20, 4, 9, -8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, 26, 9, 13, 0, 0, 7); c.fill();
  // luz do peito (a "fagulha")
  if (glow) {
    const r = 9 + Math.sin(t * 5) * 1.6, g = c.createRadialGradient(0, 8, 0, 0, 8, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 8, r * 2.2, 0, 7); c.fill();
  }
  // ---- braços ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const a1 = (P[0] + ph * (pose === 'fall' ? 16 : 5)) * Math.PI / 180, a2 = (P[1] + ph * (pose === 'fall' ? 18 : 6)) * Math.PI / 180;
    const sx = sd * 14, sy = 4;
    const ex = sx + sd * 30 * Math.cos(a1), ey = sy - 30 * Math.sin(a1);
    const hx = ex + sd * 32 * Math.cos(a2), hy = ey - 32 * Math.sin(a2);
    c.strokeStyle = line; c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = skinL; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    // três dedos compridos
    const dir = Math.atan2(hy - ey, hx - ex);
    for (const k of [-.55, 0, .55]) {
      const fx = hx + Math.cos(dir + k) * 13, fy = hy + Math.sin(dir + k) * 13;
      c.strokeStyle = line; c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = skinL; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
    }
  }
  // ---- pescoço ----
  c.fillStyle = skinD; c.fillRect(-5, -14, 10, 10);
  // ---- orelhas ----
  for (const sd of [-1, 1]) {
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sd * 27, -64); c.bezierCurveTo(sd * 46, -70 - ear * .5, sd * 66, -88 - ear, sd * 76, -92 - ear);
    c.bezierCurveTo(sd * 70, -66, sd * 54, -40, sd * 30, -38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hit ? '#e8a0a0' : '#eeaacb';
    c.beginPath(); c.moveTo(sd * 32, -60); c.bezierCurveTo(sd * 48, -66 - ear * .4, sd * 60, -80 - ear * .8, sd * 68, -84 - ear * .8);
    c.bezierCurveTo(sd * 62, -64, sd * 50, -46, sd * 34, -44); c.closePath(); c.fill();
  }
  // ---- cabeça ----
  const gh = c.createLinearGradient(0, -80, 0, -4); gh.addColorStop(0, skinL); gh.addColorStop(1, skinD);
  c.fillStyle = gh; c.strokeStyle = line; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(0, -82); c.bezierCurveTo(34, -82, 42, -50, 24, -22); c.bezierCurveTo(16, -10, 7, -5, 0, -5);
  c.bezierCurveTo(-7, -5, -16, -10, -24, -22); c.bezierCurveTo(-42, -50, -34, -82, 0, -82); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-8, -70, 12, 6, -.4, 0, 7); c.fill();
  // ---- olhos enormes ----
  const look = (o.vx || 0) * 3;
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 15, -44); c.rotate(sd * .22);
    if (hit) {
      c.strokeStyle = line; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-8, -8); c.lineTo(8, 8); c.moveTo(8, -8); c.lineTo(-8, 8); c.stroke();
    } else {
      c.scale(1, blink);
      const ge = c.createRadialGradient(-2, -4, 1, 0, 0, 16); ge.addColorStop(0, '#3a3560'); ge.addColorStop(1, '#0a0716');
      c.fillStyle = ge; c.beginPath(); c.ellipse(0, 0, 11.5, 15, 0, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3.5 + look, -6, 3.6, 4.6, 0, 0, 7); c.fill();
      c.beginPath(); c.arc(3.5 + look * .6, 6, 1.9, 0, 7); c.fill();
    }
    c.restore();
  }
  // ---- nariz e boca ----
  c.fillStyle = line; c.beginPath(); c.arc(-2.4, -24, 1.1, 0, 7); c.arc(2.4, -24, 1.1, 0, 7); c.fill();
  c.strokeStyle = line; c.lineWidth = 2; c.beginPath();
  if (hit) c.ellipse(0, -15, 3, 4, 0, 0, 7); else { c.moveTo(-5, -17); c.quadraticCurveTo(0, -12.5, 5, -17); }
  c.stroke();
  c.restore();
}

/* ================= JOGO: FAGULHA — QUEDA ENTRE MUNDOS ================= */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };   // navegadores antigos
const W = 420, H = 640;
const PY = 190;                 // altura fixa do Fagulha na tela (o cenário é que sobe)
const BASE_V = 230;             // velocidade da queda (pixels por segundo)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- MUNDOS: troca a cada 250 metros ---------- */
const SEG = 2500;               // 2500 = 250 metros (dist/10 = metros)
const MUNDOS = [
  { nome: 'LAVA',     topo: '#3a0d0d', fundo: '#120404', pilar: '#5a1a12', luz: '#ff6a2b' },
  { nome: 'CÉU',       topo: '#3a7bd5', fundo: '#0d2a55', pilar: '#2a5a9a', luz: '#eaffff' },
  { nome: 'DESERTO',   topo: '#7a5320', fundo: '#2a1a08', pilar: '#a06a2a', luz: '#ffd97a' },
  { nome: 'CIDADE',    topo: '#241246', fundo: '#0a0618', pilar: '#3a2a6a', luz: '#ff5ec6' },
  { nome: 'DOCES',     topo: '#ff9fd0', fundo: '#c23f8a', pilar: '#e8c99a', luz: '#fff3b0' },
];
function worldIndex(d) { return Math.floor(d / SEG) % MUNDOS.length; }

let estado = 'inicio';          // inicio | jogando | gameover | vitoria
let t = 0, dist = 0, vel = BASE_V;
let vidas = 3, invenc = 0, cristais = 0, shake = 0, flash = 0;
const jog = { x: W / 2, vx: 0, dir: 1 };
let obst = [], gems = [], fx = [], portais = [];
let spawnT = 1, gemT = 1, ultimaFronteira = -1;
let anuncioTxt = '', anuncioT = 0;
const keys = { left: false, right: false };

/* ---------- escolha de poder (tecla Q) — só de mostrar qual está escolhido ---------- */
const PODERES = ['ESCUDO', 'DASH', 'INVISIBILIDADE', 'CLONE'];
let poderIdx = 0, poderAnuncioT = 0;
function trocarPoder() {
  if (estado !== 'jogando') return;
  poderIdx = (poderIdx + 1) % PODERES.length;
  poderAnuncioT = 1.6;
  burst(jog.x, PY, '#ffe9a8', 10, 100);
}

/* ---------- escudo (tecla X) ---------- */
const ESCUDO_DURACAO = 2.2, ESCUDO_RECARGA = 8;
let escudoT = 0, escudoCd = 0;
function ativarEscudo() {
  if (estado !== 'jogando' || escudoCd > 0) return;
  escudoT = ESCUDO_DURACAO; escudoCd = ESCUDO_RECARGA;
  burst(jog.x, PY, '#7ad9ff', 18, 130);
}

/* ---------- dash (toque duas vezes rápido na mesma seta, ou ESPAÇO pro lado que já está olhando) ---------- */
const DASH_JANELA = 0.28, DASH_RECARGA = 0.6;
let dashT = 0, dashCd = 0, dashDir = 0, dashFlash = 0;
let ultimoToqueEsq = -10, ultimoToqueDir = -10;
function tentarDash(dir) {
  if (estado !== 'jogando' || dashCd > 0) return;
  dashT = 0.16; dashDir = dir; dashCd = DASH_RECARGA; dashFlash = 0.4;
  burst(jog.x, PY, '#bda9ff', 12, 140);
  burst(jog.x, PY, '#ffffff', 10, 100);
}

/* ---------- invisibilidade: passa direto pelos obstáculos por um tempo ---------- */
const INVIS_DURACAO = 1.8, INVIS_RECARGA = 6;
let invisT = 0, invisCd = 0, invisPoeira = 0;
function ativarInvisibilidade() {
  if (estado !== 'jogando' || invisCd > 0) return;
  invisT = INVIS_DURACAO; invisCd = INVIS_RECARGA;
  burst(jog.x, PY, '#c9c0ff', 16, 120);
}

/* ---------- clone (👥): deixa uma cópia parada que engole o 1º obstáculo (também o chiclete) ---------- */
const CLONE_DURACAO = 4, CLONE_RECARGA = 10;
let cloneT = 0, cloneCd = 0, cloneX = 0;
function ativarClone() {
  if (estado !== 'jogando' || cloneCd > 0) return;
  cloneT = CLONE_DURACAO; cloneCd = CLONE_RECARGA; cloneX = jog.x;
  burst(cloneX, PY, '#ffb6e6', 14, 110);
}

/* ---------- chiclete (mundo DOCES): não tira vida, deixa lento por 3s ---------- */
const LENTO_DURACAO = 3;
let lentoT = 0;

/* ---------- tecla X contada: 1x = escudo, 2x rápido = invisibilidade, 3x rápido = dash, 4x rápido = clone ---------- */
const X_JANELA = 0.38;
let xCliques = 0, xCliqueTimer = 0;
function resolverCliquesX() {
  if (xCliques === 1) ativarEscudo();
  else if (xCliques === 2) ativarInvisibilidade();
  else if (xCliques === 3) tentarDash(jog.dir || 1);
  else if (xCliques >= 4) ativarClone();
  xCliques = 0;
}

/* ---------- fala o nome do mundo em voz alta ---------- */
function falarMundo(nome) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const fala = new SpeechSynthesisUtterance(nome);
  fala.lang = 'pt-BR'; fala.rate = 1; fala.pitch = 1.1;
  speechSynthesis.speak(fala);
}

function resetar() {
  estado = 'jogando'; t = 0; dist = 0; vidas = 3; invenc = 0; cristais = 0; shake = 0; flash = 0;
  jog.x = W / 2; jog.vx = 0; obst = []; gems = []; fx = []; portais = []; spawnT = 1; gemT = 1; ultimaFronteira = -1;
  anuncioTxt = ''; anuncioT = 0;
  escudoT = 0; escudoCd = 0; dashT = 0; dashCd = 0; dashFlash = 0; ultimoToqueEsq = -10; ultimoToqueDir = -10;
  poderIdx = 0; poderAnuncioT = 0; invisPoeira = 0;
  invisT = 0; invisCd = 0; xCliques = 0; xCliqueTimer = 0;
  cloneT = 0; cloneCd = 0; lentoT = 0;
}

/* ---------- obstáculos: um tipo diferente para cada mundo ---------- */
function criarObstaculo() {
  const mundo = MUNDOS[worldIndex(dist)].nome;
  obst.push({ mundo, x: rnd(50, W - 50), y: H + 40, w: rnd(50, 88), h: rnd(40, 56), sd: Math.random() });
}

function desenharObstaculo(o) {
  c.save(); c.translate(o.x, o.y);
  if (o.mundo === 'LAVA') {
    // halo brilhante pra destacar do fundo escuro
    const halo = c.createRadialGradient(0, 0, 4, 0, 0, o.w * .9);
    halo.addColorStop(0, 'rgba(255,170,60,.55)'); halo.addColorStop(1, 'rgba(255,170,60,0)');
    c.fillStyle = halo; c.beginPath(); c.arc(0, 0, o.w * .9, 0, 7); c.fill();
    // rocha vulcânica vermelha viva com rachaduras brilhando
    c.fillStyle = '#7a2a14'; c.strokeStyle = '#ffb347'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-o.w / 2, o.h / 2); c.lineTo(-o.w / 2 + 6, -o.h / 3); c.lineTo(-o.w / 5, -o.h / 2); c.lineTo(o.w / 4, -o.h / 2 + 4);
    c.lineTo(o.w / 2 - 4, -o.h / 5); c.lineTo(o.w / 2, o.h / 2); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#ffe94a'; c.lineWidth = 2.4; c.beginPath();
    c.moveTo(-o.w / 6, -o.h / 4); c.lineTo(0, 0); c.lineTo(o.w / 8, o.h / 3); c.stroke();
  } else if (o.mundo === 'CÉU') {
    // halo branco pra destacar do céu azul
    const halo = c.createRadialGradient(0, 0, 4, 0, 0, o.w * .9);
    halo.addColorStop(0, 'rgba(255,255,255,.5)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = halo; c.beginPath(); c.arc(0, 0, o.w * .9, 0, 7); c.fill();
    // nuvem de tempestade quase preta com contorno branco e raio
    c.fillStyle = '#191b2e'; c.strokeStyle = '#ffffff'; c.lineWidth = 2.6;
    c.beginPath(); c.arc(-o.w / 4, 4, o.h / 3, 0, 7); c.arc(0, -6, o.h / 2.6, 0, 7); c.arc(o.w / 4, 4, o.h / 3, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ffe94a'; c.strokeStyle = '#7a5e00'; c.lineWidth = 1; c.beginPath();
    c.moveTo(4, o.h / 6); c.lineTo(-8, o.h / 2); c.lineTo(2, o.h / 2); c.lineTo(-6, o.h); c.lineTo(14, o.h / 2.6); c.lineTo(2, o.h / 2.6); c.closePath(); c.fill(); c.stroke();
  } else if (o.mundo === 'DESERTO') {
    // halo verde-limão brilhante pra destacar do fundo de areia
    const halo = c.createRadialGradient(0, 0, 4, 0, 0, o.w * .9);
    halo.addColorStop(0, 'rgba(160,255,90,.55)'); halo.addColorStop(1, 'rgba(160,255,90,0)');
    c.fillStyle = halo; c.beginPath(); c.arc(0, 0, o.w * .9, 0, 7); c.fill();
    // cacto do deserto com contorno bem vivo
    c.fillStyle = '#5cb85c'; c.strokeStyle = '#e8ff9e'; c.lineWidth = 3;
    c.beginPath(); c.roundRect ? c.roundRect(-o.w / 10, -o.h / 2, o.w / 5, o.h, 8) : c.rect(-o.w / 10, -o.h / 2, o.w / 5, o.h); c.fill(); c.stroke();
    c.beginPath(); c.roundRect ? c.roundRect(-o.w / 2, -o.h / 8, o.w / 3.2, o.h / 5, 6) : c.rect(-o.w / 2, -o.h / 8, o.w / 3.2, o.h / 5); c.fill(); c.stroke();
    c.beginPath(); c.roundRect ? c.roundRect(o.w / 6, -o.h / 3, o.w / 3.2, o.h / 5, 6) : c.rect(o.w / 6, -o.h / 3, o.w / 3.2, o.h / 5); c.fill(); c.stroke();
  } else if (o.mundo === 'DOCES') {
    // halo rosa brilhante pra destacar do fundo de doces
    const halo = c.createRadialGradient(0, 0, 4, 0, 0, o.w * .9);
    halo.addColorStop(0, 'rgba(255,111,194,.55)'); halo.addColorStop(1, 'rgba(255,111,194,0)');
    c.fillStyle = halo; c.beginPath(); c.arc(0, 0, o.w * .9, 0, 7); c.fill();
    // chiclete grudento (não tira vida, só deixa lento)
    c.fillStyle = '#ff6fc2'; c.strokeStyle = '#c2278f'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(0, o.h / 8, o.w / 2.2, o.h / 2.4, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ff9ad8';
    c.beginPath(); c.arc(-o.w / 8, -o.h / 6, o.w / 3.4, 0, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-o.w / 6, -o.h / 6 - 4, o.w / 9, o.h / 14, -.4, 0, 7); c.fill();
  } else {
    // detrito de cidade (caixote com faixa de perigo) — mundo final, mais difícil
    c.fillStyle = '#5a5266'; c.strokeStyle = '#201c2a'; c.lineWidth = 2.4;
    c.fillRect(-o.w / 2, -o.h / 2, o.w, o.h); c.strokeRect(-o.w / 2, -o.h / 2, o.w, o.h);
    c.fillStyle = '#ffd23a';
    for (let i = -o.w / 2; i < o.w / 2; i += 14) { c.save(); c.beginPath(); c.rect(-o.w / 2, -6, o.w, 12); c.clip(); c.fillRect(i, -10, 7, 20); c.restore(); }
  }
  c.restore();
}

/* ---------- partículas ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}

/* ---------- portais entre mundos ---------- */
function desenharPortal(p) {
  c.save(); c.translate(p.x, p.y);
  const giro = t * 4;
  for (let i = 0; i < 3; i++) {
    const raio = 130 - i * 22;
    const g = c.createLinearGradient(-raio, 0, raio, 0);
    g.addColorStop(0, p.corA); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, p.corB);
    c.strokeStyle = g; c.lineWidth = 8 - i * 1.8; c.globalAlpha = .55 + Math.sin(giro + i) * .2;
    c.beginPath(); c.ellipse(0, 0, raio, 46 - i * 6, 0, 0, 7); c.stroke();
  }
  c.globalAlpha = 1;
  c.restore();
}

/* ---------- entrada ---------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab', 'KeyX', 'KeyQ'].includes(k)) e.preventDefault();
  if (estado !== 'jogando') { if (k === 'Space' || k === 'Enter' || k === 'KeyR') resetar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') {
    keys.left = true;
    if (!e.repeat) {
      const agora = performance.now() / 1000;
      if (agora - ultimoToqueEsq < DASH_JANELA) tentarDash(-1);
      ultimoToqueEsq = agora;
    }
  }
  if (k === 'ArrowRight' || k === 'KeyD') {
    keys.right = true;
    if (!e.repeat) {
      const agora = performance.now() / 1000;
      if (agora - ultimoToqueDir < DASH_JANELA) tentarDash(1);
      ultimoToqueDir = agora;
    }
  }
  if (k === 'KeyX' && !e.repeat) { xCliques++; xCliqueTimer = X_JANELA; }
  if (k === 'Space' && !e.repeat) tentarDash(jog.dir || 1);
  if (k === 'KeyQ' && !e.repeat) trocarPoder();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

/* ---------- atualização ---------- */
function update(dt) {
  if (estado !== 'jogando') return;
  t += dt;
  // acelera um pouco a cada mundo, e a cidade (fase final) fica bem mais rápida
  const idxMundo = worldIndex(dist);
  const progressoMundo = (dist % SEG) / SEG;
  let extraVel = idxMundo * 14;
  if (idxMundo === MUNDOS.length - 1) {
    extraVel += 70;
    if (progressoMundo > 0.65) extraVel += 110;
  }
  vel = BASE_V + extraVel;
  dist += vel * dt;
  if (invenc > 0) invenc -= dt;
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
  if (escudoT > 0) escudoT -= dt;
  if (escudoCd > 0) escudoCd -= dt;
  if (dashCd > 0) dashCd -= dt;
  if (dashFlash > 0) dashFlash -= dt;
  if (poderAnuncioT > 0) poderAnuncioT -= dt;
  if (invisT > 0) invisT -= dt;
  if (invisCd > 0) invisCd -= dt;
  if (invisT > 0) {
    invisPoeira -= dt;
    if (invisPoeira <= 0) { burst(jog.x, PY, '#c9c0ff', 2, 40); invisPoeira = 0.06; }
  } else invisPoeira = 0;
  if (xCliqueTimer > 0) {
    xCliqueTimer -= dt;
    if (xCliqueTimer <= 0) resolverCliquesX();
  }

  // ---- movimento do Fagulha (dash de dois toques tem prioridade) ----
  if (dashT > 0) {
    dashT -= dt;
    jog.dir = dashDir;
    jog.vx = dashDir * 900;
    jog.x = clamp(jog.x + dashDir * 900 * dt, 34, W - 34);
  } else {
    const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    if (ax) jog.dir = ax;
    const velMax = 300 * (lentoT > 0 ? 0.5 : 1); // chiclete deixa 50% mais lento
    jog.vx += (ax * velMax - jog.vx) * Math.min(1, dt * 10);
    jog.x = clamp(jog.x + jog.vx * dt, 34, W - 34);
  }

  // ---- portal: nasce um pouco antes da fronteira de 250 m e cai até o Fagulha ----
  const leadDist = H + 40 - PY;
  const fronteira = (Math.floor(dist / SEG) + 1) * SEG;
  if (fronteira - dist <= leadDist && ultimaFronteira !== fronteira) {
    const atual = MUNDOS[worldIndex(dist)], prox = MUNDOS[worldIndex(fronteira)];
    portais.push({ x: W / 2, y: H + 40, fronteira, passou: false, corA: atual.luz, corB: prox.luz });
    ultimaFronteira = fronteira;
  }
  for (const p of portais) p.y -= vel * dt;
  for (const p of portais) {
    if (!p.passou && Math.abs(p.y - PY) < 18) {
      p.passou = true; flash = .5; shake = .2;
      burst(jog.x, PY, p.corB, 22, 170);
      const proxNome = MUNDOS[worldIndex(p.fronteira)].nome;
      anuncioTxt = proxNome; anuncioT = 2.2;
      falarMundo(proxNome);
    }
  }
  portais = portais.filter(p => p.y > -90);
  if (anuncioT > 0) anuncioT -= dt;

  // ---- obstáculos (mundo final = CIDADE aparece mais rápido, mais difícil) ----
  spawnT -= dt;
  if (spawnT <= 0) {
    criarObstaculo();
    if (idxMundo === MUNDOS.length - 1) spawnT = progressoMundo > 0.65 ? 0.55 : 0.72;
    else spawnT = 1.0;
  }
  for (const o of obst) {
    o.y -= vel * dt;
  }
  obst = obst.filter(o => o.y > -80 && !o.morto);

  // ---- clone: engole o primeiro obstáculo (inclusive chiclete) que chegar perto ----
  if (cloneCd > 0) cloneCd -= dt;
  if (cloneT > 0) {
    cloneT -= dt;
    for (const o of obst) {
      if (o.morto) continue;
      if (Math.abs(o.x - cloneX) < o.w * .55 + 16 && Math.abs(o.y - PY) < o.h * .55 + 30) {
        o.morto = true; cloneT = 0;
        burst(o.x, o.y, '#ffb6e6', 16, 150);
        break;
      }
    }
  }

  // ---- cristais ----
  gemT -= dt;
  if (gemT <= 0) { gems.push({ x: rnd(40, W - 40), y: H + 30 }); gemT = .75; }
  for (const g of gems) g.y -= vel * dt;
  gems = gems.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) { cristais++; burst(g.x, g.y, '#7af6ff', 8, 90); return false; }
    return g.y > -30;
  });

  // ---- colisões ----
  const hb = { x: jog.x - 15, y: PY - 26, w: 30, h: 58 };
  for (const o of obst) {
    if (o.morto) continue;
    if (invisT > 0) continue; // invisível passa direto pelos obstáculos
    const ox = o.x - o.w * .42, oy = o.y - o.h * .42, ow = o.w * .84, oh = o.h * .84;
    if (hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy) {
      if (invenc > 0) continue;
      if (escudoT > 0) { o.morto = true; escudoT = Math.min(escudoT, .35); burst(o.x, o.y, '#7ad9ff', 14, 160); continue; }
      if (o.mundo === 'DOCES') { o.morto = true; lentoT = LENTO_DURACAO; burst(o.x, o.y, '#ff6fc2', 12, 120); continue; }
      levarDano(o);
      break;
    }
  }
  if (lentoT > 0) lentoT -= dt;

  // ---- partículas ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);

  // ---- fim de jogo: atravessou os 4 mundos ----
  if (dist >= SEG * MUNDOS.length) { estado = 'vitoria'; }
}

function levarDano(o) {
  vidas--; invenc = 1.5; shake = .3; burst(jog.x, PY, '#ff5577', 16, 180);
  if (o) o.morto = true;
  if (vidas <= 0) estado = 'gameover';
}

/* ---------- desenho ---------- */
function fundo() {
  const mAtual = MUNDOS[worldIndex(dist)];
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, mAtual.topo); g.addColorStop(1, mAtual.fundo);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // decoração ambiente por mundo (nuvens/brasas/dunas/luzes)
  // partículas ambiente (brasas/neve de nuvem/poeira/luzes)
  c.save();
  const seed = Math.floor(dist / 40);
  for (let i = 0; i < 10; i++) {
    const px = (i * 71 + seed * 37) % (W + 60) - 30;
    const py = ((i * 133 - dist * .5) % (H + 80) + H + 80) % (H + 80) - 40;
    c.globalAlpha = .35;
    if (mAtual.nome === 'LAVA') { c.fillStyle = mAtual.luz; c.beginPath(); c.arc(px, py, 2.5, 0, 7); c.fill(); }
    else if (mAtual.nome === 'CÉU') { c.fillStyle = '#fff'; c.beginPath(); c.ellipse(px, py, 20, 8, 0, 0, 7); c.fill(); }
    else if (mAtual.nome === 'DESERTO') { c.fillStyle = mAtual.luz; c.beginPath(); c.arc(px, py, 1.6, 0, 7); c.fill(); }
    else if (mAtual.nome === 'DOCES') {
      // granulado colorido caindo
      c.save(); c.translate(px, py); c.rotate(t * 2 + i);
      c.fillStyle = ['#ff6fc2', '#7ad9ff', '#ffe94a', '#a0ff8e'][i % 4];
      c.fillRect(-3, -1.4, 6, 2.8);
      c.restore();
    }
    else { c.fillStyle = mAtual.luz; c.fillRect(px, py, 3, 3); }
  }
  c.globalAlpha = 1;
  c.restore();

  // elementos grandes que identificam o mundo (vulcão, sol/pássaro, pirâmide/cacto, prédios/lua)
  c.save();
  const seed2 = Math.floor(dist / 260);
  for (let i = 0; i < 5; i++) {
    const px = (i * 97 + seed2 * 53) % (W + 140) - 70;
    const py = ((i * 191 - dist * .9) % (H + 200) + H + 200) % (H + 200) - 100;
    if (mAtual.nome === 'LAVA') {
      // vulcão com lava escorrendo
      c.fillStyle = '#241010'; c.strokeStyle = '#000'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(px - 46, py + 40); c.lineTo(px - 14, py - 34); c.lineTo(px + 14, py - 34); c.lineTo(px + 46, py + 40); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = mAtual.luz; c.beginPath(); c.moveTo(px - 10, py - 30); c.lineTo(px, py - 44); c.lineTo(px + 10, py - 30); c.closePath(); c.fill();
      c.strokeStyle = mAtual.luz; c.lineWidth = 3; c.beginPath(); c.moveTo(px, py - 28); c.quadraticCurveTo(px + 14, py, px + 6, py + 38); c.stroke();
    } else if (mAtual.nome === 'CÉU') {
      if (i % 2 === 0) {
        // pássaro em V
        c.strokeStyle = '#2a3a6a'; c.lineWidth = 3; c.beginPath();
        c.moveTo(px - 14, py); c.quadraticCurveTo(px - 6, py - 10, px, py);
        c.quadraticCurveTo(px + 6, py - 10, px + 14, py); c.stroke();
      } else {
        // nuvem grande fofa
        c.fillStyle = 'rgba(255,255,255,.85)';
        c.beginPath(); c.arc(px - 18, py, 16, 0, 7); c.arc(px, py - 8, 20, 0, 7); c.arc(px + 20, py, 16, 0, 7); c.arc(px, py + 10, 20, 0, 7); c.fill();
      }
    } else if (mAtual.nome === 'DESERTO') {
      if (i % 2 === 0) {
        // pirâmide
        c.fillStyle = '#c48a3a'; c.strokeStyle = '#6b4718'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(px - 40, py + 34); c.lineTo(px, py - 40); c.lineTo(px + 40, py + 34); c.closePath(); c.fill(); c.stroke();
        c.strokeStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(px, py - 40); c.lineTo(px, py + 34); c.stroke();
      } else {
        // cacto
        c.fillStyle = '#4a8a4a'; c.strokeStyle = '#2a5a2a'; c.lineWidth = 2;
        c.beginPath(); c.roundRect ? c.roundRect(px - 6, py - 30, 12, 60, 6) : c.rect(px - 6, py - 30, 12, 60); c.fill(); c.stroke();
        c.beginPath(); c.roundRect ? c.roundRect(px - 20, py - 6, 14, 10, 5) : c.rect(px - 20, py - 6, 14, 10); c.fill(); c.stroke();
        c.beginPath(); c.roundRect ? c.roundRect(px + 8, py - 16, 14, 10, 5) : c.rect(px + 8, py - 16, 14, 10); c.fill(); c.stroke();
      }
    } else if (mAtual.nome === 'CIDADE') {
      // prédio com janelas acesas
      const alt = 60 + (i % 3) * 30, larg = 34;
      c.fillStyle = mAtual.pilar; c.strokeStyle = '#000'; c.lineWidth = 1.6;
      c.fillRect(px - larg / 2, py - alt, larg, alt); c.strokeRect(px - larg / 2, py - alt, larg, alt);
      c.fillStyle = mAtual.luz;
      for (let j = 0; j < Math.floor(alt / 16); j++) for (let k = 0; k < 2; k++) {
        if ((i + j + k) % 3) c.fillRect(px - larg / 2 + 6 + k * 16, py - alt + 8 + j * 16, 8, 8);
      }
    } else {
      // biscoito gigante com gotas de chocolate (mundo DOCES)
      c.fillStyle = '#e8c99a'; c.strokeStyle = '#a97a3a'; c.lineWidth = 2.4;
      c.beginPath(); c.arc(px, py, 32, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#6b3a1e';
      for (const [dx, dy] of [[-14, -10], [10, -14], [-6, 8], [14, 10], [0, 0]]) {
        c.beginPath(); c.arc(px + dx, py + dy, 4, 0, 7); c.fill();
      }
    }
  }
  c.restore();

  c.fillStyle = mAtual.pilar; for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.fillRect(0, y, 26, 100); c.fillRect(W - 26, y, 26, 100); }
  c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 2; for (let k = -1; k < 8; k++) { const y = k * 100 - (dist % 100); c.strokeRect(2, y + 2, 22, 96); c.strokeRect(W - 24, y + 2, 22, 96); }
}

function desenhar() {
  c.save();
  if (shake > 0) c.translate(rnd(-5, 5), rnd(-5, 5));
  fundo();

  for (const p of portais) desenharPortal(p);
  for (const g of gems) {
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 3 + g.x) * .3);
    c.fillStyle = '#7af6ff'; c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 0); c.lineTo(0, 11); c.lineTo(-8, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -8); c.lineTo(3, -1); c.lineTo(-3, -1); c.fill(); c.restore();
  }
  for (const o of obst) desenharObstaculo(o);

  // ---- escudo (bolha ao redor do Fagulha) ----
  if (escudoT > 0) {
    c.save(); c.translate(jog.x, PY + 4);
    const pulso = 44 + Math.sin(t * 9) * 4;
    const g = c.createRadialGradient(0, 0, pulso * .5, 0, 0, pulso);
    g.addColorStop(0, 'rgba(122,217,255,.05)'); g.addColorStop(.75, 'rgba(122,217,255,.28)'); g.addColorStop(1, 'rgba(122,217,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, pulso, 0, 7); c.fill();
    c.strokeStyle = 'rgba(200,240,255,.85)'; c.lineWidth = 2.4; c.beginPath(); c.arc(0, 0, pulso, 0, 7); c.stroke();
    c.restore();
  }

  // ---- luz brilhante marcando a ativação do dash ----
  if (dashFlash > 0) {
    const al = clamp(dashFlash / 0.4, 0, 1);
    c.save(); c.translate(jog.x, PY + 4);
    const gl = c.createRadialGradient(0, 0, 0, 0, 0, 78);
    gl.addColorStop(0, `rgba(255,255,255,${al * .95})`);
    gl.addColorStop(.4, `rgba(189,169,255,${al * .55})`);
    gl.addColorStop(1, 'rgba(189,169,255,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(0, 0, 78, 0, 7); c.fill();
    c.restore();
  }

  // ---- rastro do dash (afterimages brilhantes marcando o caminho) ----
  if (dashT > 0) {
    for (let i = 1; i <= 4; i++) {
      c.save();
      c.shadowColor = '#bda9ff'; c.shadowBlur = 14;
      c.globalAlpha = .22 * (5 - i);
      drawFagulha(c, jog.x - dashDir * i * 16, PY + 12, .42, t, { vx: dashDir, glow: null });
      c.restore();
    }
    c.globalAlpha = 1;
  }

  // ---- clone parado (👥) esperando engolir um obstáculo ----
  if (cloneT > 0) {
    c.save(); c.globalAlpha = .8;
    drawFagulha(c, cloneX, PY + 12, .42, t, { vx: 0, glow: '#ffb6e6' });
    c.restore();
  }

  // ---- brilho fantasma quando invisível ----
  if (invisT > 0 && estado === 'jogando') {
    c.save(); c.translate(jog.x, PY + 4);
    const pulso = 40 + Math.sin(t * 10) * 5;
    const gv = c.createRadialGradient(0, 0, 0, 0, 0, pulso);
    gv.addColorStop(0, 'rgba(201,192,255,.35)'); gv.addColorStop(1, 'rgba(201,192,255,0)');
    c.fillStyle = gv; c.beginPath(); c.arc(0, 0, pulso, 0, 7); c.fill();
    c.restore();
  }

  // ---- o Fagulha ----
  const piscando = invenc > 0 && Math.floor(t * 14) % 2 === 0;
  if (estado !== 'gameover') {
    drawFagulha(c, jog.x, PY + 12, .42, t, {
      vx: clamp(jog.vx / 300, -1, 1), hit: invenc > 1.2,
      alpha: invisT > 0 ? .38 : (piscando ? .3 : 1) });
  }
  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.restore();

  if (flash > 0) { c.fillStyle = `rgba(255,255,255,${clamp(flash / .5, 0, 1) * .85})`; c.fillRect(0, 0, W, H); }

  if (anuncioT > 0 && estado === 'jogando') {
    const al = clamp(Math.min(anuncioT, 2.2 - anuncioT + .5) / .5, 0, 1);
    c.globalAlpha = al;
    c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, H / 2 - 34, W, 68);
    texto('MUNDO: ' + anuncioTxt, W / 2, H / 2, 18, '#ffe9a8');
    c.globalAlpha = 1;
  }

  if (poderAnuncioT > 0 && estado === 'jogando') {
    const al = clamp(Math.min(poderAnuncioT, 1.6 - poderAnuncioT + .4) / .4, 0, 1);
    c.globalAlpha = al;
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, H / 2 + 46, W, 44);
    texto('PODER: ' + PODERES[poderIdx], W / 2, H / 2 + 68, 11, '#c9c0ff');
    c.globalAlpha = 1;
  }

  hud();
  telas();
}

/* ---------- HUD e telas ---------- */
function texto(txt, x, y, tam, cor, al) {
  c.font = `${tam}px 'Press Start 2P', monospace`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 4); c.strokeStyle = '#0a0a18'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function hud() {
  if (estado === 'inicio') return;
  c.font = '20px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) c.fillText(i < vidas ? '❤️' : '🖤', 12 + i * 26, 22);
  texto('💎 ' + cristais, W - 14, 22, 12, '#7af6ff', 'right');
  const pr = clamp((dist % SEG) / SEG, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 14, 44, 6, 140);
  c.fillStyle = '#7CFF9E'; c.fillRect(W - 14, 44, 6, 140 * pr);
  texto(Math.floor(dist / 10) + ' m', W - 11, 196, 8, '#fff', 'right');
  texto(MUNDOS[worldIndex(dist)].nome, W / 2, 22, 10, '#fff');

  // ---- ícone do escudo (X): brilhante quando pronto, apagado em recarga ----
  c.save();
  c.translate(12, 52);
  const pronto = escudoCd <= 0;
  c.globalAlpha = pronto ? 1 : .35;
  c.font = '22px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText('🛡️', 0, 0);
  c.globalAlpha = 1;
  if (!pronto) {
    const p = clamp(1 - escudoCd / ESCUDO_RECARGA, 0, 1);
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 3; c.beginPath();
    c.arc(11, 0, 15, -Math.PI / 2, -Math.PI / 2 + p * 6.283); c.stroke();
  }
  c.restore();
  texto(pronto ? 'X 1x ESCUDO' : Math.ceil(escudoCd) + 's', 40, 52, 7, pronto ? '#7ad9ff' : '#999', 'left');

  // ---- poder atualmente escolhido (Q pra trocar) ----
  texto('Q: ' + PODERES[poderIdx], 12, 70, 7, '#c9c0ff', 'left');
}

function telas() {
  if (estado === 'inicio') {
    c.fillStyle = 'rgba(5,5,20,.72)'; c.fillRect(0, 0, W, H);
    texto('FAGULHA', W / 2, 150, 34, '#ffe9a8');
    texto('QUEDA ENTRE MUNDOS', W / 2, 200, 12, '#7af6ff');
    texto('LAVA · CÉU · DESERTO · CIDADE · DOCES', W / 2, 226, 8, '#ffd97a');
    drawFagulha(c, W / 2, 345, .9, performance.now() / 1000, { pose: 'stand' });
    texto('X 1x=ESCUDO 2x=INVISÍVEL 3x=DASH 4x=CLONE', W / 2, 452, 7, '#7ad9ff');
    texto('ESPAÇO/◀◀▶▶ TAMBÉM DÁ DASH · Q TROCA PODER', W / 2, 470, 7, '#c9c0ff');
    if (Math.floor(performance.now() / 500) % 2) texto('APERTE ESPAÇO', W / 2, 520, 14, '#fff');
  } else if (estado === 'gameover') {
    c.fillStyle = 'rgba(30,0,10,.78)'; c.fillRect(0, 0, W, H);
    texto('GAME OVER', W / 2, 220, 30, '#ff3355');
    texto('💎 ' + cristais + '   ⬇ ' + Math.floor(dist / 10) + ' m', W / 2, 290, 12, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 400, 11, '#fff');
  } else if (estado === 'vitoria') {
    c.fillStyle = 'rgba(0,20,10,.78)'; c.fillRect(0, 0, W, H);
    texto('CRUZOU OS 4 MUNDOS!', W / 2, 170, 18, '#7CFF9E');
    drawFagulha(c, W / 2, 300, .95, performance.now() / 1000, { pose: 'cheer', glow: '#7CFF9E' });
    texto('💎 ' + cristais, W / 2, 470, 16, '#7af6ff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 540, 11, '#fff');
  }
}

/* ---------- laço principal ---------- */
let ultimo = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try {
  if (estado === 'inicio') t += dt;
  update(dt);
  desenhar();
  } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
