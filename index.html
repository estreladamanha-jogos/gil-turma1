<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novo Amanhã</title>
<style>
  :root { --hud: #ffe9a8; }
  html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; font-family: sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  main { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
  canvas { width: 100%; height: 100%; display: block; background: #0a0a18; touch-action: none; }
  footer { position: absolute; inset: 0; pointer-events: none; }
  .btn { position: absolute; pointer-events: auto; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 1.4em; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  .dpad { position: absolute; left: 2%; bottom: 6%; width: 38vmin; height: 38vmin; max-width: 170px; max-height: 170px; }
  .dpad .btn { width: 32%; height: 32%; }
  .d-up { left: 34%; top: 0; } .d-down { left: 34%; bottom: 0; }
  .d-left { left: 0; top: 34%; } .d-right { right: 0; top: 34%; }
  .d-jumpside { left: 34%; top: 34%; font-size: .9em; border-radius: 10px; }
  .acoes { position: absolute; right: 2%; bottom: 6%; width: 44vmin; height: 30vmin; max-width: 210px; max-height: 150px; }
  .a-pular { right: 0; bottom: 0; width: 34%; height: 50%; background: rgba(122,217,255,.22); }
  .a-atacar { right: 38%; bottom: 0; width: 34%; height: 50%; background: rgba(255,90,90,.22); }
  .a-poder { right: 19%; bottom: 52%; width: 34%; height: 46%; background: rgba(189,169,255,.22); }
  .a-trocar { right: 0; bottom: 52%; width: 22%; height: 46%; font-size: .9em; background: rgba(255,233,168,.22); }
  .pausa { position: absolute; top: 3%; right: 3%; width: 9vmin; height: 9vmin; max-width: 46px; max-height: 46px; pointer-events: auto; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.5); border-radius: 10px; color: #fff; font-size: 1.1em; display: flex; align-items: center; justify-content: center; }
  @media (pointer: fine) and (hover: hover) { .dpad, .acoes { display: none; } }
</style>
</head>
<body>
<main>
<canvas id="game" width="960" height="540"></canvas>
<footer>
  <section class="dpad" aria-hidden="true">
    <button class="btn d-up" data-k="up">⬆️</button>
    <button class="btn d-down" data-k="down">⬇️</button>
    <button class="btn d-left" data-k="left">⬅️</button>
    <button class="btn d-right" data-k="right">➡️</button>
  </section>
  <section class="acoes" aria-hidden="true">
    <button class="btn a-pular" data-k="pular">🔵</button>
    <button class="btn a-atacar" data-k="atacar">⚔️</button>
    <button class="btn a-poder" data-k="poder">✨</button>
    <button class="btn a-trocar" data-k="trocar">🔄</button>
  </section>
  <button class="pausa" data-k="pausa">⏸️</button>
</footer>
</main>
<script>
/* ===================== NOVO AMANHÃ — plataforma lateral ===================== */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h, r) { this.rect(x, y, w, h); };
const W = 960, H = 540;
const GROUND_Y = H - 110;
const GRAV = 2000, JUMP_V = -700, CLIMB_V = 160;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist2 = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

/* ---------- personagens jogáveis ---------- */
const PERSONAGENS = {
  guerreiro: { nome: 'GUERREIRO', vidaMax: 6, manaMax: 100, vel: 230, pulo: JUMP_V, atkAlcance: 50, atkAltura: 46, atkDano: 1, atkCd: .38,
    cor1: '#6b4a2a', cor2: '#3a6b3a', pele: '#c89a6e',
    poderes: [
      { nome: 'Golpe Poderoso', custo: 25, fn: p => { p.golpeBuffT = 3; } },
      { nome: 'Escudo Protetor', custo: 35, fn: p => { p.escudoHits = 3; p.escudoT = 6; } },
    ] },
  arqueira: { nome: 'ARQUEIRA', vidaMax: 4, manaMax: 100, vel: 275, pulo: JUMP_V - 20, atkAlcance: 420, atkAltura: 30, atkDano: 1, atkCd: .46,
    cor1: '#3a6b3a', cor2: '#7a5a3a', pele: '#d9ac82',
    poderes: [
      { nome: 'Flecha Mágica', custo: 20, fn: p => { p.flechaBuffN = 2; } },
      { nome: 'Chuva de Flechas', custo: 30, fn: (p, jogo) => { for (let i = -2; i <= 2; i++) jogo.flechas.push({ x: p.x + p.dir * 20, y: p.y - 30, vx: p.dir * 620, vy: i * 70, dano: 1, pierce: 1, magica: true, vida: 1.4 }); } },
    ] },
};

/* ---------- 4 fases ---------- */
const PHASES = [
  { nome: 'FLORESTA INICIAL', emoji: '🌿', compr: 4200, tangAlvo: 90,
    ceuA: '#bfe8ff', ceuB: '#eafff0', chaoA: '#6ab04c', chaoB: '#3c7a2e', plat: '#8fce6a', bordaPlat: '#4e7a2e',
    enemyPool: ['morcego', 'esqueleto'], enemyN: 7, launcher: 'toco', portalCor: '#3fb0ff',
    chefao: { nome: 'Guardião da Floresta', tipo: 'tartaruga', hpMax: 30, cor: '#4a7a3a', cor2: '#2e5a26',
      ataques: [ { tipo: 'rolar', dodge: 'pular' }, { tipo: 'folhas', dodge: 'agachar' }, { tipo: 'pata', dodge: 'pular' } ] } },
  { nome: 'CASTELO DE PEDRA', emoji: '🏰', compr: 5000, tangAlvo: 110,
    ceuA: '#cdd6e6', ceuB: '#9fb0cf', chaoA: '#8a8a94', chaoB: '#55555e', plat: '#b7b7c2', bordaPlat: '#d8b65a',
    enemyPool: ['morcego', 'esqueleto', 'zumbi'], enemyN: 9, launcher: 'catapulta', portalCor: '#e8c23a',
    chefao: { nome: 'Senhor do Castelo', tipo: 'esqueletao', hpMax: 45, cor: '#d9cfa8', cor2: '#8a2222',
      ataques: [ { tipo: 'golpeH', dodge: 'pular' }, { tipo: 'ondaOssos', dodge: 'pular' }, { tipo: 'craneos', dodge: 'agachar' } ] } },
  { nome: 'ENTRADA DA MASMORRA', emoji: '🕯️', compr: 5600, tangAlvo: 130,
    ceuA: '#2a1a3a', ceuB: '#140a1e', chaoA: '#4a2a5a', chaoB: '#241030', plat: '#5a3a6a', bordaPlat: '#b48aff',
    enemyPool: ['esqueleto', 'zumbi', 'aranha', 'fantasma'], enemyN: 13, launcher: 'pilares', portalCor: '#b48aff',
    chefao: { nome: 'Sombra da Masmorra', tipo: 'morcegao', hpMax: 55, cor: '#2a2030', cor2: '#ff3b3b',
      ataques: [ { tipo: 'mergulho', dodge: 'mover' }, { tipo: 'nevoa', dodge: 'esperar' }, { tipo: 'garras', dodge: 'agachar' } ] } },
  { nome: 'BEIRA DO PÂNTANO', emoji: '💧', compr: 6200, tangAlvo: 150,
    ceuA: '#aab4ab', ceuB: '#7a8a7e', chaoA: '#5a4a32', chaoB: '#3a2e1e', plat: '#6a5a3e', bordaPlat: '#7adfae',
    enemyPool: ['goblin', 'cavaleiro', 'aranha', 'zumbi'], enemyN: 17, launcher: 'jorro', portalCor: '#4dff9e', agua: true,
    chefao: { nome: 'Titã do Pântano', tipo: 'polvo', hpMax: 70, cor: '#2a5a4a', cor2: '#3ad0ff',
      ataques: [ { tipo: 'tentaculoChao', dodge: 'pular' }, { tipo: 'jato', dodge: 'agachar' }, { tipo: 'ondaAgua', dodge: 'pular' }, { tipo: 'agarrar', dodge: 'mover' } ] } },
];

/* ---------- estado geral ---------- */
let estado = 'selecao';   // selecao | jogando | pausado | gameover | vitoriafase | vitoriafinal
let t = 0;
let personagemSel = 'guerreiro';
let faseIdx = 0, fase = null;
let camX = 0;
let tangTotal = 0;
let msgTxt = '', msgT = 0;
let bannerTxt = '', bannerT = 0;
let fx = [];
const keys = { left: false, right: false, up: false, down: false };
let pularPress = false, atacarPress = false, poderPress = false, trocarPress = false, pausaPress = false;

const jog = { x: 0, y: GROUND_Y, vx: 0, vy: 0, dir: 1, onGround: true, climbing: null, agachado: false,
  vida: 6, vidaMax: 6, mana: 100, manaMax: 100, poderIdx: 0, invT: 0, atkT: 0, atkAnimT: 0,
  golpeBuffT: 0, escudoHits: 0, escudoT: 0, flechaBuffN: 0, checkX: 0, checkY: GROUND_Y };

let inimigos = [], flechas = [], tangerinas = [], potions = [], chests = [], checkpoints = [],
  climbs = [], plataformas = [], pits = [], lancadores = [];
let boss = null, bossGateX = 0, bossArenaX1 = 0, bossArenaX2 = 0, portal = null, camLimit = 0;

/* ---------- menu de pausa ---------- */
let pausaOpc = 0, instrucoesAberto = false;
let volMusica = 70, volEfeitos = 80;
const OPC_PAUSA = ['Continuar', 'Reiniciar Fase', 'Música', 'Efeitos', 'Instruções', 'Sair para Início'];

/* ---------- utilidades de burst ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}
function mostrarMsg(txt) { msgTxt = txt; msgT = 1.8; }
function falar(nome) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(nome); u.lang = 'pt-BR'; u.rate = 1; u.pitch = 1;
  speechSynthesis.speak(u);
}

/* ===================== GERAÇÃO DE FASE ===================== */
function gerarFase(idx) {
  const cfg = PHASES[idx];
  plataformas = []; climbs = []; pits = []; potions = []; chests = []; tangerinas = [];
  inimigos = []; lancadores = []; checkpoints = [];
  bossArenaX1 = cfg.compr - 280; bossArenaX2 = cfg.compr - 60; bossGateX = bossArenaX1 - 40;

  // chão principal (sólido) do início até o fim da arena do chefão
  plataformas.push({ x: -200, y: GROUND_Y, w: cfg.compr + 400, h: H - GROUND_Y, tipo: 'chao' });

  // covas/água — só entre o começo e o portão do chefão, nunca na arena
  const nPits = idx === 3 ? 5 : 3;
  for (let i = 0; i < nPits; i++) {
    const x = 700 + i * (bossGateX - 700) / nPits + rnd(-60, 60);
    pits.push({ x1: x, x2: x + rnd(90, 130) });
  }

  // duas estruturas de subida com poção + baú escondidos (metade 1 e metade 2 da fase)
  const climbXs = [bossGateX * 0.33, bossGateX * 0.72];
  const tiposSobe = idx === 3 ? ['corrente', 'folha'] : ['escada', 'corrente'];
  climbXs.forEach((cx, i) => {
    const topoY = GROUND_Y - 190;
    climbs.push({ x: cx, y1: topoY, y2: GROUND_Y, tipo: tiposSobe[i] });
    plataformas.push({ x: cx - 90, y: topoY, w: 190, h: 16, tipo: 'secreta' });
    // segunda plataforma vizinha, alcançável com um pulo
    plataformas.push({ x: cx + 150, y: topoY - 10, w: 150, h: 16, tipo: 'secreta' });
    potions.push({ x: cx - 20, y: topoY - 18, tipo: i === 0 ? 'vida' : 'mana', pego: false });
    chests.push({ x: cx + 200, y: topoY - 28, w: 42, h: 30, aberto: false, premio: null });
  });

  // checkpoints (início + 3 ao longo do caminho)
  checkpoints.push({ x: 60 });
  for (let i = 1; i <= 3; i++) checkpoints.push({ x: (bossGateX * i) / 4 });

  // inimigos espalhados pelo chão (fora das covas e perto do início)
  for (let i = 0; i < cfg.enemyN; i++) {
    const x = 420 + (i * (bossGateX - 500)) / cfg.enemyN + rnd(-40, 40);
    const tipo = cfg.enemyPool[i % cfg.enemyPool.length];
    inimigos.push(criarInimigo(tipo, x));
  }

  // lançadores (2 por fase)
  const lx1 = bossGateX * 0.48, lx2 = bossGateX * 0.85;
  [lx1, lx2].forEach(x => lancadores.push({ x, tipo: cfg.launcher, fase: 'aviso', timer: rnd(.8, 1.6) }));

  // tangerinas espalhadas
  const passo = Math.max(60, (bossGateX - 200) / cfg.tangAlvo);
  for (let x = 220; x < bossGateX - 60; x += passo) {
    tangerinas.push({ x: x + rnd(-14, 14), y: GROUND_Y - 34 - (Math.sin(x * .02) * 10 + 10), pego: false });
  }

  boss = { ...cfg.chefao, x: bossArenaX2 - 90, y: GROUND_Y, hp: cfg.chefao.hpMax, ativo: false, derrotado: false,
    atkIdx: 0, timer: 1.4, estadoAtk: 'espera', hazardY: 0, hazardAtiva: false, entrada: 0 };

  portal = { x: bossArenaX2 - 30, y: GROUND_Y, ativo: false, passou: false };

  camX = 0; camLimit = Infinity;
  jog.x = 60; jog.y = GROUND_Y; jog.vx = 0; jog.vy = 0; jog.onGround = true; jog.climbing = null;
  jog.checkX = 60; jog.checkY = GROUND_Y;
  bannerTxt = fase ? '' : ''; bannerT = 0;
  fase = cfg;
}

function criarInimigo(tipo, x) {
  const base = {
    esqueleto: { hp: 2, vel: 60, dano: 1, w: 34, h: 56 },
    morcego: { hp: 1, vel: 90, dano: 1, w: 34, h: 26, voa: true },
    zumbi: { hp: 2, vel: 36, dano: 1, w: 36, h: 58 },
    aranha: { hp: 2, vel: 70, dano: 1, w: 40, h: 30 },
    fantasma: { hp: 2, vel: 55, dano: 1, w: 36, h: 50, flutua: true },
    goblin: { hp: 2, vel: 110, dano: 1, w: 32, h: 46 },
    cavaleiro: { hp: 3, vel: 50, dano: 1, w: 38, h: 58 },
  }[tipo];
  return { tipo, x, y: base.voa ? GROUND_Y - 120 : (base.flutua ? GROUND_Y - 60 : GROUND_Y), hp: base.hp, hpMax: base.hp,
    vel: base.vel, dano: base.dano, w: base.w, h: base.h, dir: -1, vivo: true, baseY: GROUND_Y, faseVoo: Math.random() * 6 };
}

/* ===================== ENTRADA ===================== */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX', 'KeyC', 'Escape', 'KeyP'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (k === 'ArrowUp' || k === 'KeyW') keys.up = true;
  if (k === 'ArrowDown' || k === 'KeyS') keys.down = true;
  if (k === 'Space' && !e.repeat) pularPress = true;
  if (k === 'KeyZ' && !e.repeat) atacarPress = true;
  if (k === 'KeyX' && !e.repeat) poderPress = true;
  if (k === 'KeyC' && !e.repeat) trocarPress = true;
  if ((k === 'Escape' || k === 'KeyP') && !e.repeat) pausaPress = true;
  if (estado === 'selecao' && !e.repeat) {
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD') personagemSel = personagemSel === 'guerreiro' ? 'arqueira' : 'guerreiro';
    if (k === 'Enter' || k === 'Space') iniciarJogo();
  } else if (estado === 'pausado' && !e.repeat) {
    if (k === 'ArrowUp' || k === 'KeyW') pausaOpc = (pausaOpc + OPC_PAUSA.length - 1) % OPC_PAUSA.length;
    if (k === 'ArrowDown' || k === 'KeyS') pausaOpc = (pausaOpc + 1) % OPC_PAUSA.length;
    if (k === 'ArrowLeft' || k === 'ArrowRight') ajustarPausa(k === 'ArrowRight' ? 1 : -1);
    if (k === 'Enter') confirmarPausa();
  } else if ((estado === 'gameover' || estado === 'vitoriafase' || estado === 'vitoriafinal') && !e.repeat) {
    if (k === 'Enter' || k === 'Space') {
      if (estado === 'gameover') reiniciarFase();
      else if (estado === 'vitoriafase') { faseIdx++; gerarFase(faseIdx); estado = 'jogando'; }
      else { estado = 'selecao'; }
    }
  }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
});

/* ---------- controles de toque ---------- */
document.querySelectorAll('[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const down = ev => {
    ev.preventDefault();
    if (k === 'left') keys.left = true;
    else if (k === 'right') keys.right = true;
    else if (k === 'up') keys.up = true;
    else if (k === 'down') keys.down = true;
    else if (k === 'pular') pularPress = true;
    else if (k === 'atacar') atacarPress = true;
    else if (k === 'poder') poderPress = true;
    else if (k === 'trocar') trocarPress = true;
    else if (k === 'pausa') pausaPress = true;
  };
  const up = ev => {
    ev.preventDefault();
    if (k === 'left') keys.left = false;
    else if (k === 'right') keys.right = false;
    else if (k === 'up') keys.up = false;
    else if (k === 'down') keys.down = false;
  };
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up, { passive: false });
  btn.addEventListener('mousedown', down);
  addEventListener('mouseup', up);
});
cv.addEventListener('click', ev => {
  if (estado !== 'selecao') return;
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX - r.left) / r.width * W;
  personagemSel = mx < W / 2 ? 'guerreiro' : 'arqueira';
});

function ajustarPausa(d) {
  if (OPC_PAUSA[pausaOpc] === 'Música') volMusica = clamp(volMusica + d * 10, 0, 100);
  if (OPC_PAUSA[pausaOpc] === 'Efeitos') volEfeitos = clamp(volEfeitos + d * 10, 0, 100);
}
function confirmarPausa() {
  const o = OPC_PAUSA[pausaOpc];
  if (o === 'Continuar') estado = 'jogando';
  else if (o === 'Reiniciar Fase') { reiniciarFase(); estado = 'jogando'; }
  else if (o === 'Instruções') instrucoesAberto = !instrucoesAberto;
  else if (o === 'Sair para Início') { estado = 'selecao'; instrucoesAberto = false; }
}

function iniciarJogo() {
  const p = PERSONAGENS[personagemSel];
  jog.vidaMax = p.vidaMax; jog.vida = p.vidaMax; jog.manaMax = p.manaMax; jog.mana = p.manaMax;
  jog.poderIdx = 0; jog.golpeBuffT = 0; jog.escudoHits = 0; jog.flechaBuffN = 0;
  tangTotal = 0; faseIdx = 0;
  gerarFase(0);
  estado = 'jogando';
}
function reiniciarFase() {
  const p = PERSONAGENS[personagemSel];
  jog.vida = jog.vidaMax; jog.mana = jog.manaMax;
  gerarFase(faseIdx);
  estado = 'jogando';
}
function respawnCheckpoint() {
  jog.x = jog.checkX; jog.y = jog.checkY; jog.vx = 0; jog.vy = 0; jog.climbing = null; jog.invT = 1.5;
}
function levarDano(dmg) {
  if (jog.invT > 0) return;
  if (jog.escudoHits > 0) { jog.escudoHits--; jog.invT = .6; burst(jog.x, jog.y - 60, '#ffe9a8', 10, 120); return; }
  jog.vida -= dmg || 1; jog.invT = 1.3; burst(jog.x, jog.y - 60, '#ff5577', 16, 160);
  if (jog.vida <= 0) { estado = 'gameover'; return; }
  respawnCheckpoint();
}

/* ===================== ATUALIZAÇÃO ===================== */
function update(dt) {
  t += dt;
  if (estado !== 'jogando') return;
  const P = PERSONAGENS[personagemSel];

  if (pausaPress) { pausaPress = false; estado = 'pausado'; pausaOpc = 0; return; }

  if (jog.invT > 0) jog.invT -= dt;
  if (jog.atkT > 0) jog.atkT -= dt;
  if (jog.atkAnimT > 0) jog.atkAnimT -= dt;
  if (jog.golpeBuffT > 0) jog.golpeBuffT -= dt;
  if (jog.escudoT > 0) { jog.escudoT -= dt; if (jog.escudoT <= 0) jog.escudoHits = 0; }
  if (jog.flechaBuffN > 0 && jog.atkAnimT <= 0 && jog.atkT <= 0) { /* consumido no disparo */ }
  if (msgT > 0) msgT -= dt;
  if (bannerT > 0) bannerT -= dt;

  // ---- checkpoints ----
  for (const cp of checkpoints) if (jog.x > cp.x && jog.checkX < cp.x) { jog.checkX = cp.x; jog.checkY = GROUND_Y; }

  // ---- movimento horizontal ----
  const podeMover = jog.climbing === null;
  jog.agachado = false;
  if (podeMover) {
    const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    if (ax) jog.dir = ax;
    if (keys.down && jog.onGround && ax === 0) jog.agachado = true;
    const vel = jog.agachado ? P.vel * .2 : P.vel;
    jog.vx = ax * vel;
    jog.x += jog.vx * dt;

    // pulo
    if (pularPress && jog.onGround) { jog.vy = P.pulo; jog.onGround = false; burst(jog.x, jog.y, '#fff', 6, 70); }

    // gravidade
    jog.vy += GRAV * dt;
    jog.y += jog.vy * dt;

    // colisão com chão / plataformas
    jog.onGround = false;
    const dentroPit = pits.some(p => jog.x > p.x1 && jog.x < p.x2);
    if (!dentroPit && jog.y >= GROUND_Y && jog.vy >= 0) { jog.y = GROUND_Y; jog.vy = 0; jog.onGround = true; }
    for (const pl of plataformas) {
      if (pl.tipo !== 'secreta') continue;
      if (jog.vy >= 0 && jog.y <= pl.y + 10 && jog.y + jog.vy * dt >= pl.y - 2 && jog.x > pl.x && jog.x < pl.x + pl.w) {
        jog.y = pl.y; jog.vy = 0; jog.onGround = true;
      }
    }
    // caiu na água/cova
    if (jog.y > H + 60) levarDano(1);
  } else {
    jog.vx = 0;
  }

  // ---- escadas / correntes / folhas ----
  if (jog.climbing) {
    const cl = jog.climbing;
    if (keys.up) jog.y -= CLIMB_V * dt;
    if (keys.down) jog.y += CLIMB_V * dt;
    jog.y = clamp(jog.y, cl.y1, cl.y2);
    jog.vy = 0;
    if (jog.y <= cl.y1 + 2) jog.onGround = true;
    if (pularPress) {
      jog.climbing = null; jog.vy = JUMP_V * .7; jog.vx = (keys.left ? -1 : keys.right ? 1 : jog.dir) * P.vel;
      jog.onGround = false;
    }
  } else {
    for (const cl of climbs) {
      if (Math.abs(jog.x - cl.x) < 26 && jog.y >= cl.y1 - 10 && jog.y <= cl.y2 + 4 && (keys.up || keys.down)) {
        jog.climbing = cl; jog.x = cl.x; break;
      }
    }
  }

  // ---- limites de câmera (não dá pra voltar) ----
  const desejada = jog.x - 300;
  const maxCam = Math.min(camLimit, fase.compr - W + 140);
  camX = clamp(Math.max(camX, desejada), 0, Math.max(0, maxCam));
  jog.x = Math.max(jog.x, camX + 24);
  jog.x = Math.min(jog.x, camX + W - 24);

  pularPress = false;

  // ---- ataque ----
  if (atacarPress && jog.atkT <= 0) {
    atacarPress = false; jog.atkT = P.atkCd; jog.atkAnimT = .18;
    const dano = P.atkDano * (jog.golpeBuffT > 0 ? 2 : 1);
    if (personagemSel === 'guerreiro') {
      aplicarDanoArea(jog.x + jog.dir * P.atkAlcance * .5, jog.y - 30, P.atkAlcance, P.atkAltura, dano);
      burst(jog.x + jog.dir * 30, jog.y - 30, '#fff', 8, 90);
    } else {
      const pierce = jog.flechaBuffN > 0 ? 2 : 1; if (jog.flechaBuffN > 0) jog.flechaBuffN--;
      flechas.push({ x: jog.x + jog.dir * 20, y: jog.y - 32, vx: jog.dir * 640, vy: 0, dano, pierce, magica: pierce > 1, vida: 1.4 });
    }
  }
  atacarPress = false;

  // ---- poder ----
  if (poderPress) {
    poderPress = false;
    const pod = P.poderes[jog.poderIdx];
    if (jog.mana >= pod.custo) { jog.mana -= pod.custo; pod.fn(jog, { flechas }); burst(jog.x, jog.y - 40, '#bda9ff', 16, 130); mostrarMsg(pod.nome + '!'); }
  }
  if (trocarPress) { trocarPress = false; jog.poderIdx = (jog.poderIdx + 1) % P.poderes.length; }

  // ---- flechas ----
  for (const f of flechas) { f.x += f.vx * dt; f.y += f.vy * dt; f.vida -= dt; }
  flechas = flechas.filter(f => f.vida > 0 && f.pierce > 0);
  for (const f of flechas) {
    for (const o of inimigos) {
      if (!o.vivo || f.pierce <= 0) continue;
      if (Math.abs(f.x - o.x) < o.w * .6 && Math.abs(f.y - (o.y - o.h / 2)) < o.h * .6) {
        o.hp -= f.dano; f.pierce--; burst(o.x, o.y - o.h / 2, '#ffd23a', 8, 100);
        if (o.hp <= 0) matarInimigo(o);
      }
    }
    if (boss && boss.ativo && !boss.derrotado && f.pierce > 0 && Math.abs(f.x - boss.x) < 70 && Math.abs(f.y - (boss.y - 70)) < 80) {
      boss.hp -= f.dano; f.pierce--; burst(boss.x, boss.y - 70, '#fff', 10, 110);
      if (boss.hp <= 0) derrotarBoss();
    }
  }

  // ---- tangerinas ----
  for (const tg of tangerinas) {
    if (tg.pego) continue;
    if (dist2(jog.x, jog.y - 30, tg.x, tg.y) < 26) {
      tg.pego = true; tangTotal++;
      if (tangTotal % 100 === 0) { jog.vidaMax = Math.min(9, jog.vidaMax + 1); jog.vida = Math.min(jog.vidaMax, jog.vida + 1); mostrarMsg('Vida extra! ❤️'); }
    }
  }

  // ---- poções ----
  for (const p of potions) {
    if (p.pego) continue;
    if (dist2(jog.x, jog.y - 30, p.x, p.y) < 30) {
      p.pego = true;
      if (p.tipo === 'vida') { jog.vida = jog.vidaMax; mostrarMsg('Vida Completa!'); }
      else { jog.mana = jog.manaMax; mostrarMsg('Mana Completa!'); }
      burst(p.x, p.y, p.tipo === 'vida' ? '#ff5577' : '#7ad9ff', 14, 120);
    }
  }

  // ---- baús ----
  for (const ch of chests) {
    if (ch.aberto) continue;
    if (keys.down && dist2(jog.x, jog.y - 20, ch.x, ch.y) < 50) {
      ch.aberto = true;
      const r = ['vida', 'mana', 'tangerinas', 'coracao', 'vazio'][Math.floor(Math.random() * 5)];
      ch.premio = r;
      if (r === 'vida') { jog.vida = jog.vidaMax; mostrarMsg('Baú: Vida Completa! ✨'); }
      else if (r === 'mana') { jog.mana = jog.manaMax; mostrarMsg('Baú: Mana Completa! ✨'); }
      else if (r === 'tangerinas') { tangTotal += 15; mostrarMsg('Baú: +15 🍊'); }
      else if (r === 'coracao') { jog.vidaMax = Math.min(9, jog.vidaMax + 1); jog.vida = jog.vidaMax; mostrarMsg('Baú: Coração extra! ❤️'); }
      else mostrarMsg('Baú vazio...');
      burst(ch.x, ch.y, '#ffd23a', 16, 130);
    }
  }

  // ---- lançadores ----
  for (const l of lancadores) {
    l.timer -= dt;
    if (l.fase === 'aviso' && l.timer <= 0) { l.fase = 'ativo'; l.timer = .5; dispararLancador(l); }
    else if (l.fase === 'ativo' && l.timer <= 0) { l.fase = 'recarga'; l.timer = 1.4; }
    else if (l.fase === 'recarga' && l.timer <= 0) { l.fase = 'aviso'; l.timer = rnd(1, 1.6); }
    if (l.fase === 'ativo' && Math.abs(jog.x - l.x) < 70) {
      const ok = l.dodgeTipo === 'pular' ? !jog.onGround : l.dodgeTipo === 'agachar' ? jog.agachado : (!jog.onGround || jog.agachado);
      if (!ok) levarDano(1);
    }
  }

  // ---- inimigos ----
  for (const o of inimigos) {
    if (!o.vivo) continue;
    o.faseVoo += dt;
    if (o.tipo === 'morcego') o.y = o.baseY - 120 + Math.sin(o.faseVoo * 1.6) * 60;
    else if (o.tipo === 'fantasma') o.y = o.baseY - 55 + Math.sin(o.faseVoo * 1.2) * 14;
    const toJog = jog.x - o.x;
    if (Math.abs(toJog) < 320) { o.dir = toJog > 0 ? 1 : -1; o.x += o.dir * o.vel * dt; }
    if (Math.abs(jog.x - o.x) < o.w * .6 + 16 && Math.abs((jog.y - 30) - (o.y - o.h / 2)) < o.h * .6 + 18) {
      levarDano(o.dano);
    }
    if (jog.atkAnimT > .05 && personagemSel === 'guerreiro') {
      // tratado em aplicarDanoArea
    }
  }

  // ---- chefão ----
  atualizarBoss(dt);

  // ---- portal ----
  if (boss && boss.derrotado) {
    portal.ativo = true;
    if (!portal.passou && dist2(jog.x, jog.y - 40, portal.x, portal.y - 40) < 50) {
      portal.passou = true; burst(portal.x, portal.y - 40, fase.portalCor, 30, 200);
      if (faseIdx < PHASES.length - 1) { estado = 'vitoriafase'; bannerTxt = 'FASE ' + (faseIdx + 1) + ' CONCLUÍDA!'; bannerT = 3; }
      else { estado = 'vitoriafinal'; }
    }
  }

  // ---- partículas ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);
}

function aplicarDanoArea(cx, cy, alcance, altura, dano) {
  for (const o of inimigos) {
    if (!o.vivo) continue;
    if (Math.abs(o.x - jog.x) < alcance && (jog.dir > 0 ? o.x > jog.x : o.x < jog.x) && Math.abs((o.y - o.h / 2) - cy) < altura) {
      o.hp -= dano; burst(o.x, o.y - o.h / 2, '#fff', 8, 100);
      if (o.hp <= 0) matarInimigo(o);
    }
  }
  if (boss && boss.ativo && !boss.derrotado && Math.abs(boss.x - jog.x) < alcance + 30 && (jog.dir > 0 ? boss.x > jog.x : boss.x < jog.x)) {
    boss.hp -= dano; burst(boss.x, boss.y - 70, '#fff', 10, 110);
    if (boss.hp <= 0) derrotarBoss();
  }
}
function matarInimigo(o) { o.vivo = false; burst(o.x, o.y - o.h / 2, '#ffb6e6', 14, 130); }

function dispararLancador(l) {
  if (l.tipo === 'toco') { l.hazY = GROUND_Y - 20; l.dodgeTipo = 'pular'; }
  else if (l.tipo === 'catapulta') { l.hazY = GROUND_Y - 90; l.dodgeTipo = 'agachar'; }
  else if (l.tipo === 'pilares') { l.hazY = GROUND_Y - 20; l.dodgeTipo = 'ambos'; }
  else if (l.tipo === 'jorro') {
    const alturas = [GROUND_Y - 30, GROUND_Y - 90, GROUND_Y - 150];
    l.hazY = alturas[Math.floor(Math.random() * 3)];
    l.dodgeTipo = l.hazY < GROUND_Y - 100 ? 'agachar' : 'pular';
  }
}

/* ---------- chefão: IA genérica ---------- */
function atualizarBoss(dt) {
  if (!boss) return;
  if (!boss.ativo && !boss.derrotado && jog.x > bossGateX) {
    boss.ativo = true; camLimit = bossArenaX1 - 50; boss.entrada = 1.6;
    bannerTxt = fase.emoji + ' ' + boss.nome; bannerT = 2.6; falar(boss.nome);
  }
  if (!boss.ativo || boss.derrotado) return;
  if (boss.entrada > 0) { boss.entrada -= dt; return; }

  boss.timer -= dt;
  const rapido = boss.hp < boss.hpMax * .5;
  if (boss.estadoAtk === 'espera' && boss.timer <= 0) {
    boss.estadoAtk = 'aviso'; boss.timer = rapido ? .55 : .9;
    boss.atkIdx = Math.floor(Math.random() * boss.ataques.length);
  } else if (boss.estadoAtk === 'aviso' && boss.timer <= 0) {
    boss.estadoAtk = 'ativo'; boss.timer = .55; boss.hazardAtiva = true;
  } else if (boss.estadoAtk === 'ativo' && boss.timer <= 0) {
    boss.hazardAtiva = false; boss.estadoAtk = 'espera'; boss.timer = rapido ? .7 : 1.3;
  }
  if (boss.hazardAtiva && Math.abs(jog.x - boss.x) < 260) {
    const dodge = boss.ataques[boss.atkIdx].dodge;
    let ok = false;
    if (dodge === 'pular') ok = !jog.onGround;
    else if (dodge === 'agachar') ok = jog.agachado;
    else if (dodge === 'mover') ok = Math.abs(jog.x - boss.lastX0) > 90;
    else if (dodge === 'esperar') ok = true;
    if (!ok) levarDano(1);
  }
  if (boss.estadoAtk === 'espera') boss.lastX0 = jog.x;
}
function derrotarBoss() {
  boss.derrotado = true; boss.ativo = false; boss.hazardAtiva = false;
  burst(boss.x, boss.y - 70, '#ffe9a8', 44, 230);
  mostrarMsg('Chefão derrotado!');
}

/* ===================== DESENHO ===================== */
function fundo() {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, fase.ceuA); g.addColorStop(1, fase.ceuB);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // paralaxe de decoração simples
  c.save();
  for (let i = 0; i < 8; i++) {
    const px = ((i * 260 - camX * .3) % (W + 300) + W + 300) % (W + 300) - 150;
    c.globalAlpha = .5;
    if (fase.nome === 'FLORESTA INICIAL') { c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(px, 70 + (i % 3) * 30, 42, 16, 0, 0, 7); c.fill(); }
    else if (fase.nome === 'CASTELO DE PEDRA') { c.fillStyle = '#7d7d88'; c.fillRect(px, 60, 30, 160); }
    else if (fase.nome === 'ENTRADA DA MASMORRA') { c.strokeStyle = 'rgba(180,138,255,.4)'; c.lineWidth = 6; c.beginPath(); c.moveTo(px, 0); c.lineTo(px, 90); c.stroke(); }
    else { c.fillStyle = '#3a4a3a'; c.fillRect(px, 40, 18, 220); }
  }
  c.globalAlpha = 1; c.restore();
}

function desenharChao() {
  const x0 = camX - 50, x1 = camX + W + 50;
  // base sólida
  const g = c.createLinearGradient(0, GROUND_Y, 0, H); g.addColorStop(0, fase.chaoA); g.addColorStop(1, fase.chaoB);
  c.fillStyle = g; c.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // covas (água ou abismo)
  for (const p of pits) {
    if (p.x2 < x0 || p.x1 > x1) continue;
    const sx = p.x1 - camX, w = p.x2 - p.x1;
    if (fase.agua) {
      const ga = c.createLinearGradient(0, GROUND_Y, 0, H); ga.addColorStop(0, '#2a6a8a'); ga.addColorStop(1, '#0a2a3a');
      c.fillStyle = ga; c.fillRect(sx, GROUND_Y, w, H - GROUND_Y);
      c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2;
      for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(sx, GROUND_Y + 8 + Math.sin(t * 2 + k) * 3 + k * 10); c.lineTo(sx + w, GROUND_Y + 8 + Math.cos(t * 2 + k) * 3 + k * 10); c.stroke(); }
    } else {
      c.fillStyle = '#05050a'; c.fillRect(sx, GROUND_Y, w, H - GROUND_Y);
    }
  }
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, GROUND_Y); c.lineTo(W, GROUND_Y); c.stroke();
  // plataformas secretas
  for (const pl of plataformas) {
    if (pl.tipo !== 'secreta') continue;
    const sx = pl.x - camX; if (sx + pl.w < -20 || sx > W + 20) continue;
    c.fillStyle = fase.plat; c.strokeStyle = fase.bordaPlat; c.lineWidth = 3;
    c.beginPath(); c.roundRect(sx, pl.y, pl.w, pl.h, 6); c.fill(); c.stroke();
  }
  // escadas / correntes / folhas
  for (const cl of climbs) {
    const sx = cl.x - camX; if (sx < -40 || sx > W + 40) continue;
    c.save(); c.translate(sx, 0);
    if (cl.tipo === 'escada') {
      c.strokeStyle = '#8a5a2a'; c.lineWidth = 5;
      c.beginPath(); c.moveTo(-14, cl.y1); c.lineTo(-14, cl.y2); c.moveTo(14, cl.y1); c.lineTo(14, cl.y2); c.stroke();
      c.lineWidth = 4; for (let y = cl.y1 + 10; y < cl.y2; y += 20) { c.beginPath(); c.moveTo(-14, y); c.lineTo(14, y); c.stroke(); }
    } else if (cl.tipo === 'corrente') {
      c.strokeStyle = '#c9c9d4'; c.lineWidth = 6; c.lineCap = 'round';
      for (let y = cl.y1; y < cl.y2; y += 18) { c.beginPath(); c.ellipse(Math.sin(y * .3) * 3, y, 7, 9, 0, 0, 7); c.stroke(); }
    } else {
      const bob = Math.sin(t * 1.4 + cl.x) * 6;
      c.fillStyle = '#2a8a5a'; c.strokeStyle = '#7adfae'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(0, cl.y1 + bob, 46, 16, 0, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#1a6a3a'; c.beginPath(); c.ellipse(0, cl.y2 - 6, 50, 14, 0, 0, 7); c.fill();
    }
    c.restore();
  }
}

function desenharPersonagem(x, y, dir, cor1, cor2, pele, agachado, hit, atkAnim) {
  c.save(); c.translate(x, y); c.scale(dir, 1);
  if (hit) c.globalAlpha = .55;
  const alt = agachado ? .55 : 1;
  c.fillStyle = cor2; c.fillRect(-11, -70 * alt, 22, 70 * alt);
  const g = c.createLinearGradient(0, -70 * alt, 0, 0); g.addColorStop(0, cor1); g.addColorStop(1, cor2);
  c.fillStyle = g; c.beginPath(); c.roundRect(-13, -78 * alt, 26, 46 * alt, 6); c.fill();
  c.fillStyle = pele; c.beginPath(); c.arc(0, -86 * alt, 13, 0, 7); c.fill();
  c.fillStyle = '#1a1a1a'; c.beginPath(); c.arc(5, -88 * alt, 2, 0, 7); c.fill();
  if (atkAnim > 0) { c.strokeStyle = '#fff'; c.lineWidth = 5; c.beginPath(); c.moveTo(14, -60 * alt); c.lineTo(46, -58 * alt); c.stroke(); }
  c.restore();
}

function desenharInimigo(o) {
  if (!o.vivo) return;
  const sx = o.x - camX;
  if (sx < -60 || sx > W + 60) return;
  c.save(); c.translate(sx, o.y); c.scale(o.dir, 1);
  const cores = { esqueleto: '#e8e0c8', morcego: '#2a1a30', zumbi: '#5a8a4a', aranha: '#2a1a1a', fantasma: 'rgba(220,220,255,.65)', goblin: '#5a8a3a', cavaleiro: '#b8b8c4' };
  c.fillStyle = cores[o.tipo] || '#888'; c.strokeStyle = '#000'; c.lineWidth = 2;
  if (o.tipo === 'morcego') { c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-24, -16, -30 - Math.sin(t * 10) * 6, 0); c.quadraticCurveTo(-10, 6, 0, 0); c.quadraticCurveTo(10, 6, 30 + Math.sin(t * 10) * 6, 0); c.quadraticCurveTo(24, -16, 0, 0); c.fill(); c.beginPath(); c.arc(0, -4, 9, 0, 7); c.fill(); }
  else if (o.tipo === 'aranha') { c.beginPath(); c.ellipse(0, -14, 20, 13, 0, 0, 7); c.fill(); c.strokeStyle = cores.aranha; for (const s of [-1, 1]) for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(0, -14); c.lineTo(s * (16 + k * 6), -14 + k * 5 - 8); c.stroke(); } c.fillStyle = '#ff2b2b'; c.beginPath(); c.arc(-5, -16, 2, 0, 7); c.arc(5, -16, 2, 0, 7); c.fill(); }
  else { c.beginPath(); c.roundRect(-o.w / 2, -o.h, o.w, o.h, 8); c.fill(); c.stroke(); c.fillStyle = '#ff2b2b'; c.beginPath(); c.arc(-6, -o.h + 16, 2.4, 0, 7); c.arc(6, -o.h + 16, 2.4, 0, 7); c.fill(); }
  // vida
  for (let i = 0; i < o.hpMax; i++) { c.fillStyle = i < o.hp ? '#ff3b6b' : 'rgba(0,0,0,.3)'; c.beginPath(); c.arc(-((o.hpMax - 1) * 7) / 2 + i * 7 * o.dir, -o.h - 12, 3, 0, 7); c.fill(); }
  c.restore();
}

function desenharBoss() {
  if (!boss || !boss.ativo) return;
  const sx = boss.x - camX;
  c.save(); c.translate(sx, boss.y);
  if (boss.hazardAtiva) { c.shadowColor = '#fff'; c.shadowBlur = 24; }
  c.fillStyle = boss.cor; c.strokeStyle = boss.cor2; c.lineWidth = 5;
  c.beginPath(); c.roundRect(-70, -170, 140, 170, 30); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-24, -140, 8, 0, 7); c.arc(24, -140, 8, 0, 7); c.fill();
  c.fillStyle = boss.cor2; c.beginPath(); c.arc(-24, -140, 4, 0, 7); c.arc(24, -140, 4, 0, 7); c.fill();
  c.restore();
  // hazard visual
  if (boss.hazardAtiva) {
    const dodge = boss.ataques[boss.atkIdx].dodge;
    c.fillStyle = 'rgba(255,60,60,.35)';
    if (dodge === 'pular') c.fillRect(sx - 260, GROUND_Y - 24, 520, 24);
    else if (dodge === 'agachar') c.fillRect(sx - 260, GROUND_Y - 150, 520, 60);
    else c.fillRect(sx - 260, GROUND_Y - 160, 520, 160);
  }
}

function desenharLancadores() {
  for (const l of lancadores) {
    const sx = l.x - camX; if (sx < -60 || sx > W + 60) continue;
    c.save(); c.translate(sx, GROUND_Y);
    const cor = l.tipo === 'toco' ? '#ff6a2b' : l.tipo === 'catapulta' ? '#8a6a3a' : l.tipo === 'pilares' ? '#ff6fc2' : '#3ad0ff';
    c.fillStyle = cor; c.globalAlpha = l.fase === 'aviso' ? .5 + Math.sin(t * 16) * .3 : 1;
    c.beginPath(); c.roundRect(-16, -70, 32, 70, 6); c.fill();
    c.globalAlpha = 1;
    if (l.fase === 'ativo') {
      c.fillStyle = 'rgba(255,255,255,.75)';
      c.beginPath(); c.arc(0, (l.hazY || GROUND_Y - 20) - GROUND_Y, 20, 0, 7); c.fill();
      c.fillStyle = cor; c.beginPath(); c.arc(0, (l.hazY || GROUND_Y - 20) - GROUND_Y, 13, 0, 7); c.fill();
    }
    c.restore();
  }
}

function desenharCena() {
  c.save();
  fundo(); desenharChao();

  for (const tg of tangerinas) { if (tg.pego) continue; const sx = tg.x - camX; if (sx < -20 || sx > W + 20) continue; c.fillStyle = '#ff9a2b'; c.beginPath(); c.arc(sx, tg.y, 8, 0, 7); c.fill(); c.fillStyle = '#2e7a3a'; c.fillRect(sx - 1, tg.y - 11, 2, 5); }
  for (const p of potions) { if (p.pego) continue; const sx = p.x - camX; if (sx < -20 || sx > W + 20) continue; c.save(); c.translate(sx, p.y); c.fillStyle = p.tipo === 'vida' ? '#ff5577' : '#7ad9ff'; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(-8, -4); c.lineTo(8, -4); c.lineTo(10, 14); c.quadraticCurveTo(0, 20, -10, 14); c.closePath(); c.fill(); c.stroke(); c.fillRect(-4, -12, 8, 8); c.restore(); }
  for (const ch of chests) { const sx = ch.x - camX; if (sx < -40 || sx > W + 40) continue; c.save(); c.translate(sx, ch.y); c.fillStyle = ch.aberto ? '#6a5a3a' : '#a97a3a'; c.strokeStyle = '#3a2a16'; c.lineWidth = 3; c.beginPath(); c.roundRect(-ch.w / 2, -ch.h, ch.w, ch.h, 6); c.fill(); c.stroke(); c.fillStyle = '#ffd23a'; c.fillRect(-4, -ch.h / 2 - 3, 8, 6); c.restore(); }

  desenharLancadores();
  for (const o of inimigos) desenharInimigo(o);
  desenharBoss();

  for (const f of flechas) { const sx = f.x - camX; c.save(); c.translate(sx, f.y); c.rotate(Math.atan2(f.vy, f.vx)); c.strokeStyle = f.magica ? '#ff6fc2' : '#e8c99a'; c.lineWidth = 3; c.beginPath(); c.moveTo(-14, 0); c.lineTo(14, 0); c.stroke(); c.restore(); }

  if (portal && portal.ativo) {
    const sx = portal.x - camX;
    c.save(); c.translate(sx, GROUND_Y - 70);
    for (let i = 0; i < 3; i++) { const r = 60 - i * 12; c.strokeStyle = fase.portalCor; c.globalAlpha = .5 + Math.sin(t * 4 + i) * .3; c.lineWidth = 6 - i; c.beginPath(); c.ellipse(0, 0, r * .5, r, 0, 0, 7); c.stroke(); }
    c.globalAlpha = 1; c.restore();
  }

  const sxJog = jog.x - camX;
  const P = PERSONAGENS[personagemSel];
  const piscando = jog.invT > 0 && Math.floor(t * 14) % 2 === 0;
  if (!piscando) desenharPersonagem(sxJog, jog.y, jog.dir, P.cor1, P.cor2, P.pele, jog.agachado, false, jog.atkAnimT);
  if (jog.escudoHits > 0) { c.save(); c.translate(sxJog, jog.y - 40); c.strokeStyle = 'rgba(200,240,255,.8)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 50, 0, 7); c.stroke(); c.restore(); }

  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x - camX, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.restore();
}

/* ---------- HUD ---------- */
function texto(txt, x, y, tam, cor, al, peso) {
  c.font = `${peso || 'bold'} ${tam}px sans-serif`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 5); c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function barra(x, y, w, h, pct, corFundo, corFrente) {
  c.fillStyle = corFundo; c.beginPath(); c.roundRect(x, y, w, h, h / 2); c.fill();
  c.fillStyle = corFrente; c.beginPath(); c.roundRect(x, y, Math.max(h, w * clamp(pct, 0, 1)), h, h / 2); c.fill();
}
function hud() {
  // vida
  for (let i = 0; i < jog.vidaMax; i++) texto(i < jog.vida ? '❤️' : '🖤', 20 + i * 24, 20, 16, '#fff', 'left');
  // mana
  barra(14, 38, 150, 12, jog.mana / jog.manaMax, 'rgba(0,0,0,.4)', '#7ad9ff');
  texto('MANA', 20, 44, 8, '#fff', 'left');
  // poder ativo
  const P = PERSONAGENS[personagemSel], pod = P.poderes[jog.poderIdx];
  texto('✨ ' + pod.nome + ' (X)  🔄 C', 20, 64, 9, '#ffe9a8', 'left');

  // tangerinas + pausa
  texto('🍊 ' + tangTotal, W - 70, 20, 14, '#ffd23a', 'right');

  // progresso da fase
  const pr = clamp(jog.x / bossGateX, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(W / 2 - 110, H - 22, 220, 10);
  c.fillStyle = '#7CFF9E'; c.fillRect(W / 2 - 110, H - 22, 220 * pr, 10);
  texto(boss && boss.ativo && !boss.derrotado ? 'DERROTE O CHEFÃO!' : (pr < 1 ? 'Chefão à frente!' : fase.nome), W / 2, H - 34, 10, '#fff');

  // chefão: barra no topo
  if (boss && boss.ativo && !boss.derrotado) {
    barra(W / 2 - 180, 14, 360, 16, boss.hp / boss.hpMax, 'rgba(0,0,0,.5)', '#ff3b6b');
    texto(boss.nome, W / 2, 10, 11, '#fff');
  }

  if (msgT > 0) { c.globalAlpha = clamp(msgT, 0, 1); texto(msgTxt, W / 2, 90, 16, '#ffe9a8'); c.globalAlpha = 1; }
  if (bannerT > 0) { c.globalAlpha = clamp(bannerT, 0, 1); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, H / 2 - 40, W, 50); texto(bannerTxt, W / 2, H / 2 - 15, 20, '#ffe9a8'); c.globalAlpha = 1; }
}

/* ---------- telas ---------- */
function telaSelecao() {
  c.fillStyle = 'rgba(5,5,20,.9)'; c.fillRect(0, 0, W, H);
  texto('NOVO AMANHÃ', W / 2, 70, 36, '#ffe9a8');
  texto('ESCOLHA SEU HERÓI', W / 2, 115, 14, '#7af6ff');
  ['guerreiro', 'arqueira'].forEach((p, i) => {
    const cx = W / 2 + (i === 0 ? -200 : 200), sel = personagemSel === p;
    const P = PERSONAGENS[p];
    c.save();
    if (sel) { c.strokeStyle = '#ffe9a8'; c.lineWidth = 4; c.strokeRect(cx - 120, 160, 240, 300); }
    desenharPersonagem(cx, 420, 1, P.cor1, P.cor2, P.pele, false, false, 0);
    texto(P.nome, cx, 200, 16, sel ? '#ffe9a8' : '#fff');
    texto('❤️ ' + P.vidaMax + '   💧 ' + P.manaMax, cx, 440, 10, '#cfd', 'center', 'normal');
    texto(P.poderes[0].nome, cx, 460, 9, '#c9c0ff', 'center', 'normal');
    texto(P.poderes[1].nome, cx, 476, 9, '#c9c0ff', 'center', 'normal');
    c.restore();
  });
  if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO/ENTER: COMEÇAR · ◀▶ TROCA', W / 2, H - 40, 12, '#fff');
}
function telaPausa() {
  desenharCena(); hud();
  c.fillStyle = 'rgba(5,5,15,.78)'; c.fillRect(0, 0, W, H);
  texto('PAUSA', W / 2, 70, 26, '#ffe9a8');
  if (instrucoesAberto) {
    const linhas = [
      'Subir: ⬆️/W — Descer/Agachar/Abrir Baú: ⬇️/S',
      'Pular da escada/corrente/folha: direção + Espaço',
      'Pular: Espaço  ·  Atacar: Z  ·  Poder: X  ·  Trocar poder: C',
      'Morcegos voam livre — ataque antes de tocar',
      'Lançadores avisam antes de disparar',
      'Poções ficam em lugares altos — explore!',
      '100 tangerinas = +1 vida',
    ];
    linhas.forEach((l, i) => texto(l, W / 2, 140 + i * 24, 11, '#cfe', 'center', 'normal'));
    texto('ENTER: voltar', W / 2, H - 50, 11, '#fff');
  } else {
    OPC_PAUSA.forEach((o, i) => {
      const y = 150 + i * 42, sel = i === pausaOpc;
      let txt = o;
      if (o === 'Música') txt = 'Música: ' + volMusica + '%  (◀▶)';
      if (o === 'Efeitos') txt = 'Efeitos: ' + volEfeitos + '%  (◀▶)';
      texto((sel ? '▶ ' : '') + txt, W / 2, y, 15, sel ? '#ffe9a8' : '#fff');
    });
  }
}
function telaFim() {
  desenharCena(); hud();
  c.fillStyle = estado === 'gameover' ? 'rgba(30,0,10,.82)' : 'rgba(0,20,10,.82)'; c.fillRect(0, 0, W, H);
  if (estado === 'gameover') {
    texto('VOCÊ CAIU...', W / 2, H / 2 - 40, 30, '#ff3355');
    texto('🍊 ' + tangTotal, W / 2, H / 2 + 10, 14, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ENTER: TENTAR DE NOVO', W / 2, H / 2 + 60, 13, '#fff');
  } else if (estado === 'vitoriafase') {
    texto('FASE ' + (faseIdx + 1) + ' CONCLUÍDA!', W / 2, H / 2 - 40, 26, '#7CFF9E');
    texto('🍊 ' + tangTotal, W / 2, H / 2 + 10, 14, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ENTER: PRÓXIMA FASE', W / 2, H / 2 + 60, 13, '#fff');
  } else {
    texto('VOCÊ VENCEU AS 4 FASES!', W / 2, H / 2 - 50, 24, '#7CFF9E');
    texto('Mais fases virão depois...', W / 2, H / 2 - 14, 13, '#ffe9a8', 'center', 'normal');
    texto('🍊 ' + tangTotal, W / 2, H / 2 + 24, 14, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ENTER: TELA INICIAL', W / 2, H / 2 + 70, 13, '#fff');
  }
}

function desenhar() {
  if (estado === 'selecao') { telaSelecao(); return; }
  if (estado === 'pausado') { telaPausa(); return; }
  if (estado === 'gameover' || estado === 'vitoriafase' || estado === 'vitoriafinal') { telaFim(); return; }
  desenharCena();
  hud();
}

/* ---------- laço principal ---------- */
let ultimo = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try { update(dt); desenhar(); } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
